<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F8FD"/>
  <rect width="800" height="450" fill="url(#bgGrid)" opacity="0.6"/>
  
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#DCE4F2" stroke-width="1"/>
    </pattern>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063499"/>
      <stop offset="100%" stop-color="#031B4E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26CCFF"/>
      <stop offset="100%" stop-color="#063499"/>
    </linearGradient>
  </defs>

  <!-- Network Connections -->
  <g stroke="#26CCFF" stroke-width="2" opacity="0.6">
    <line x1="200" y1="150" x2="360" y2="120" stroke-dasharray="4,4"/>
    <line x1="200" y1="150" x2="280" y2="280"/>
    <line x1="360" y1="120" x2="480" y2="180"/>
    <line x1="360" y1="120" x2="380" y2="300"/>
    <line x1="480" y1="180" x2="600" y2="140"/>
    <line x1="480" y1="180" x2="520" y2="320"/>
    <line x1="280" y1="280" x2="380" y2="300"/>
    <line x1="380" y1="300" x2="520" y2="320"/>
    <line x1="520" y1="320" x2="640" y2="260"/>
  </g>

  <!-- Agent Nodes -->
  <circle cx="200" cy="150" r="22" fill="url(#nodeGrad)" stroke="#26CCFF" stroke-width="3"/>
  <circle cx="360" cy="120" r="28" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="480" cy="180" r="34" fill="url(#nodeGrad)" stroke="#26CCFF" stroke-width="4"/>
  <circle cx="280" cy="280" r="18" fill="url(#nodeGrad)" stroke="#DCE4F2" stroke-width="2"/>
  <circle cx="380" cy="300" r="24" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="520" cy="320" r="20" fill="url(#nodeGrad)" stroke="#26CCFF" stroke-width="3"/>
  <circle cx="600" cy="140" r="26" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="640" cy="260" r="16" fill="url(#accentGrad)" stroke="#26CCFF" stroke-width="2"/>

  <!-- Agent Direction Vectors -->
  <path d="M 222 150 L 250 142" stroke="#063499" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 388 120 L 420 135" stroke="#26CCFF" stroke-width="3"/>
  <path d="M 514 180 L 550 170" stroke="#063499" stroke-width="3"/>

  <!-- Label Badge -->
  <rect x="50" y="360" width="220" height="40" rx="8" fill="#031B4E" opacity="0.9"/>
  <text x="160" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MULTI-AGENT MODELING</text>
</svg>

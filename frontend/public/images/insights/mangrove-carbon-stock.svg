<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F8FD"/>
  <rect width="800" height="450" fill="url(#contourGrid)" opacity="0.4"/>

  <defs>
    <pattern id="contourGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.5" fill="#5B6B8A"/>
    </pattern>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063499" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#26CCFF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Coastal Contour Outline -->
  <path d="M 120 340 Q 220 200 360 250 T 580 180 T 720 280 L 800 450 L 0 450 Z" fill="url(#mapGrad)" stroke="#063499" stroke-width="2"/>
  <path d="M 160 300 Q 250 180 390 220 T 600 150 T 740 240" fill="none" stroke="#26CCFF" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Telemetry Field Points -->
  <g fill="#063499">
    <circle cx="240" cy="260" r="6"/>
    <circle cx="320" cy="230" r="8" fill="#26CCFF" stroke="#063499" stroke-width="2"/>
    <circle cx="410" cy="270" r="6"/>
    <circle cx="480" cy="210" r="10" fill="#26CCFF" stroke="#031B4E" stroke-width="3"/>
    <circle cx="550" cy="250" r="6"/>
    <circle cx="630" cy="190" r="7"/>
  </g>

  <!-- Quadrat Grid Overlays -->
  <rect x="440" y="175" width="80" height="70" fill="none" stroke="#063499" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="280" y="200" width="70" height="60" fill="none" stroke="#26CCFF" stroke-width="2"/>

  <!-- Satellite Signal Beams -->
  <path d="M 480 50 L 440 175 M 480 50 L 520 175" stroke="#26CCFF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="480,35 495,55 465,55" fill="#031B4E"/>

  <rect x="50" y="360" width="230" height="40" rx="8" fill="#031B4E" opacity="0.9"/>
  <text x="165" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SATELLITE & FIELD DATA</text>
</svg>

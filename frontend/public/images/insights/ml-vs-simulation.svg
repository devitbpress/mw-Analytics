<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F8FD"/>

  <!-- Left Side: Machine Learning Data Curves -->
  <rect x="50" y="60" width="330" height="270" rx="12" fill="#FFFFFF" stroke="#DCE4F2" stroke-width="2"/>
  <text x="215" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#063499" text-anchor="middle">MACHINE LEARNING</text>
  <text x="215" y="115" font-family="sans-serif" font-size="12" fill="#5B6B8A" text-anchor="middle">Data-Driven Regression</text>
  <path d="M 80 280 Q 150 180, 220 240 T 350 150" fill="none" stroke="#26CCFF" stroke-width="3"/>
  <circle cx="220" cy="240" r="5" fill="#063499"/>
  <circle cx="290" cy="180" r="5" fill="#063499"/>
  <circle cx="350" cy="150" r="5" fill="#063499"/>

  <!-- Center Split Divider -->
  <line x1="400" y1="60" x2="400" y2="330" stroke="#063499" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Right Side: Simulation State Chart / Mechanics -->
  <rect x="420" y="60" width="330" height="270" rx="12" fill="#FFFFFF" stroke="#DCE4F2" stroke-width="2"/>
  <text x="585" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#031B4E" text-anchor="middle">DYNAMIC SIMULATION</text>
  <text x="585" y="115" font-family="sans-serif" font-size="12" fill="#5B6B8A" text-anchor="middle">Causal Mechanics &amp; Feedback</text>
  
  <rect x="460" y="150" width="80" height="40" rx="6" fill="#063499"/>
  <text x="500" y="174" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">State A</text>
  <rect x="630" y="150" width="80" height="40" rx="6" fill="#26CCFF"/>
  <text x="670" y="174" font-family="sans-serif" font-size="11" fill="#031B4E" font-weight="bold" text-anchor="middle">State B</text>
  
  <path d="M 540 170 L 630 170" stroke="#031B4E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 190 Q 585 260 500 190" fill="none" stroke="#063499" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="360" width="240" height="40" rx="8" fill="#031B4E" opacity="0.9"/>
  <text x="170" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ML VS SIMULATION COMPARISON</text>
</svg>

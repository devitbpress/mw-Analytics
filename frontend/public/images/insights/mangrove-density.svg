<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F8FD"/>

  <!-- Matrix Grid Density Heatmap Motif -->
  <g transform="translate(180, 70)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#031B4E" opacity="0.9"/>
    <rect x="80" y="0" width="70" height="70" rx="8" fill="#063499" opacity="0.8"/>
    <rect x="160" y="0" width="70" height="70" rx="8" fill="#26CCFF" opacity="0.7"/>
    <rect x="240" y="0" width="70" height="70" rx="8" fill="#063499" opacity="0.9"/>
    <rect x="320" y="0" width="70" height="70" rx="8" fill="#031B4E" opacity="0.85"/>

    <!-- Row 2 -->
    <rect x="0" y="80" width="70" height="70" rx="8" fill="#063499" opacity="0.75"/>
    <rect x="80" y="80" width="70" height="70" rx="8" fill="#26CCFF" opacity="0.9"/>
    <rect x="160" y="80" width="70" height="70" rx="8" fill="#063499" opacity="0.95"/>
    <rect x="240" y="80" width="70" height="70" rx="8" fill="#26CCFF" opacity="0.85"/>
    <rect x="320" y="80" width="70" height="70" rx="8" fill="#063499" opacity="0.7"/>

    <!-- Row 3 -->
    <rect x="0" y="160" width="70" height="70" rx="8" fill="#26CCFF" opacity="0.6"/>
    <rect x="80" y="160" width="70" height="70" rx="8" fill="#063499" opacity="0.85"/>
    <rect x="160" y="160" width="70" height="70" rx="8" fill="#031B4E" opacity="0.95"/>
    <rect x="240" y="160" width="70" height="70" rx="8" fill="#063499" opacity="0.8"/>
    <rect x="320" y="160" width="70" height="70" rx="8" fill="#26CCFF" opacity="0.65"/>
  </g>

  <!-- Legend Scale -->
  <g transform="translate(180, 320)">
    <text x="0" y="-10" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6B8A">NDVI Density Index</text>
    <rect x="0" y="0" width="390" height="14" rx="4" fill="url(#ndviGrad)"/>
    <text x="0" y="30" font-family="sans-serif" font-size="11" fill="#0F1B33">0.0 (Sparse)</text>
    <text x="390" y="30" font-family="sans-serif" font-size="11" fill="#0F1B33" text-anchor="end">1.0 (Dense Canopy)</text>
  </g>

  <defs>
    <linearGradient id="ndviGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4F8FD"/>
      <stop offset="30%" stop-color="#26CCFF"/>
      <stop offset="70%" stop-color="#063499"/>
      <stop offset="100%" stop-color="#031B4E"/>
    </linearGradient>
  </defs>

  <rect x="50" y="360" width="220" height="40" rx="8" fill="#031B4E" opacity="0.9"/>
  <text x="160" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VEGETATION DENSITY GRID</text>
</svg>

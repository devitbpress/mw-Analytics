<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F8FD"/>

  <!-- Left: Simulation Engine Code/Box -->
  <rect x="100" y="110" width="180" height="200" rx="10" fill="#031B4E"/>
  <text x="190" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#26CCFF" text-anchor="middle">Simulation Engine</text>
  <rect x="120" y="170" width="140" height="8" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <rect x="120" y="190" width="100" height="8" rx="2" fill="#26CCFF" opacity="0.8"/>
  <rect x="120" y="210" width="120" height="8" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <rect x="120" y="230" width="80" height="8" rx="2" fill="#26CCFF" opacity="0.8"/>
  <rect x="120" y="250" width="130" height="8" rx="2" fill="#FFFFFF" opacity="0.6"/>

  <!-- Flow Connector Arrow -->
  <g transform="translate(310, 190)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#063499" stroke-width="4" stroke-dasharray="8,4"/>
    <polygon points="150,10 170,20 150,30" fill="#063499"/>
    <text x="85" y="0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5B6B8A" text-anchor="middle">REST / WebSocket API</text>
  </g>

  <!-- Right: Web Application Browser Screen -->
  <rect x="500" y="100" width="220" height="220" rx="10" fill="#FFFFFF" stroke="#063499" stroke-width="3"/>
  <path d="M 500 100 L 720 100 L 720 130 L 500 130 Z" fill="#063499"/>
  <circle cx="515" cy="115" r="4" fill="#FF5F56"/>
  <circle cx="528" cy="115" r="4" fill="#FFBD2E"/>
  <circle cx="541" cy="115" r="4" fill="#27C93F"/>
  <text x="610" y="120" font-family="sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Web Dashboard</text>

  <!-- Dashboard Widgets -->
  <rect x="515" y="145" width="90" height="70" rx="4" fill="#F4F8FD" stroke="#DCE4F2"/>
  <rect x="525" y="185" width="20" height="20" fill="#063499"/>
  <rect x="550" y="165" width="20" height="40" fill="#26CCFF"/>

  <rect x="615" y="145" width="90" height="70" rx="4" fill="#F4F8FD" stroke="#DCE4F2"/>
  <circle cx="660" cy="180" r="20" fill="none" stroke="#063499" stroke-width="6" stroke-dasharray="80,30"/>

  <rect x="515" y="230" width="190" height="75" rx="4" fill="#F4F8FD" stroke="#DCE4F2"/>
  <path d="M 525 280 Q 570 240 610 270 T 695 240" fill="none" stroke="#26CCFF" stroke-width="3"/>

  <rect x="50" y="360" width="240" height="40" rx="8" fill="#031B4E" opacity="0.9"/>
  <text x="170" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MODEL TO WEB TOOL FLOW</text>
</svg>
